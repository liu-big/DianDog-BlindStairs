seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 10000
empirical_normalization: true
policy:
  class_name: ActorCritic
  init_noise_std: 0.12
  noise_std_type: log
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  num_prop_obs: null
  num_scan_obs: null
  num_actor_scan_obs: null
  num_critic_scan_obs: null
  scan_encoder_dims: null
  actor_scan_encoder_dims: null
  critic_scan_encoder_dims: null
  encode_scan_for_critic: true
  priv_obs_encoder_dims: null
  priv_encoder_dims: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.001
  desired_kl: 0.008
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg: null
clip_actions: null
save_interval: 50
experiment_name: diandog_stairs_omni_student_rl
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
